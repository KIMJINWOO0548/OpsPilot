name: local-contract-and-g2-ci
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
        working-directory: web
      - run: corepack pnpm test
        working-directory: web
      - run: corepack pnpm build
        working-directory: web
      - run: python -m pip install -c requirements-runtime.lock -e '.[dev]'
      - run: ruff check src tests scripts
      - run: pytest -q
      - run: python scripts/check_package.py
      - run: python scripts/eval_smoke.py
      - run: python scripts/smoke_demo.py
      - run: python scripts/eval_compare.py evaluation/examples/contract_v1/experiment.json
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q
      - run: docker compose up --build -d --wait
      - run: curl --fail http://127.0.0.1:8000/health
      - if: always()
        run: docker compose down
