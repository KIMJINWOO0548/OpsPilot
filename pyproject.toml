[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opspilot-x"
version = "0.1.0"
description = "Evidence Integrity Engine research starter with a deterministic local demo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.6,<3"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
opspilot_x = ["fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E9", "F"]
