services:
  opspilot:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - app_data:/data
    environment:
      OPSPILOT_DB: /data/opspilot.sqlite3
      OPSPILOT_SECURE_COOKIE: "false"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
volumes:
  app_data:
